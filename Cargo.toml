# [workspace]
# resolver = "3"
# members = [ "windows-rs"]

[package]
name = "poker-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
futures-util = "0.3.34"
rcgen = "0.14.10"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features=["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26.6", features = ["ring"] }
rustls = { version = "0.23.46", features = ["ring", "std"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
winapi = { version = "0.3.9", features = ["wincon"] }
windows-collections = { path = "windows-rs/crates/libs/collections" }
windows-core = { path = "windows-rs/crates/libs/core" }
windows-future = { path = "windows-rs/crates/libs/future" }
windows-reactor = { path = "windows-rs/crates/libs/reactor" }
windows-time = { path = "windows-rs/crates/libs/time" }
tokio-util = "0.7.20"
chrono = { version = "0.4.45", features = ["serde"] }

[build-dependencies]
windows-bindgen = { path = "windows-rs/crates/libs/bindgen" }
