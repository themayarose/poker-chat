[package]
name = "poker-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
futures-util = "0.3.34"
rcgen = "0.14.10"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features=["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26.6", features = ["ring"] }
rustls = { version = "0.23.46", features = ["ring", "std"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
winapi = { version = "0.3.9", features = ["wincon"] }
windows-collections = "0.100.0"
windows-core = "0.100.0"
windows-future = "0.100.0"
windows-reactor = "0.100.0"
windows-time = "0.100.0"
tokio-util = "0.7.20"
